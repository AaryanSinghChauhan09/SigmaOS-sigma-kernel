[package]
name = "sigmaos-sigma-kernel"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "SigmaOS kernel — no_std core with boot info, MM, VFS, drivers"

[lib]
name = "sigma_kernel"
path = "src/lib.rs"

[dependencies]

[build-dependencies]
sigmaos-sigma-bootloader = { path = "../SigmaOS-sigma-bootloader" }

[[bin]]
name = "sigma-kernel"
path = "src/bin/sigma-kernel/main.rs"

[features]
default = []
# Enable std-backed tests on host.
test-std = []
